name: devpilot

# ============================================================
# DevPilot Docker Compose 一键部署
# 3 个容器：Redis + OpenClaw + Claude Code（含内置 LiteLLM 代理）
# 支持多平台大模型：Agnes AI、DeepSeek、GLM、火山方舟、百炼
# 所有平台均走 OpenAI Chat Completion 协议
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # Redis：缓存 + 持久化（推荐 Redis 8 LTS）
  # ============================================================
  redis:
    image: redis:8.8.1-alpine3.23
    container_name: devpilot-redis
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
      - ./logs/redis:/logs
    environment:
      - TZ=${TZ}
    networks:
      - devpilot-network
    # 【对外发布】将 Redis 6379 发布到宿主机（宿主机端口由 REDIS_PORT 控制，默认 6379），
    # 供宿主机 / 局域网客户端直连（如 redis-cli / RDM 等工具）。
    # OpenClaw 等内部容器仍经服务名 redis:6379 访问，不走宿主机端口。
    # 安全依赖：redis.conf 的 protected-mode + --requirepass 强密码（init.sh 自动生成）。
    # 仅本机调试可改为 "127.0.0.1:${REDIS_PORT:-6379}:6379"；
    # 生产环境建议防火墙限制来源 IP，并保持 REDIS_PASSWORD 为强密码。
    ports:
      - "${REDIS_PORT:-6379}:6379"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================
  # OpenClaw：飞书 AI 机器人 + 多平台大模型对接
  # ============================================================
  openclaw:
    # 显式 image: 避免 docker compose 自动用 '<项目目录名>-<服务名>' 拼出 'devpilot-devpilot-openclaw'（多前缀）
    image: devpilot-openclaw:latest
    build:
      context: .
      dockerfile: dockerfiles/openclaw/Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.7.1-2}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-openclaw
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://127.0.0.1:4000}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}

      # OpenClaw 核心配置
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT}
      # Agent 默认模型覆盖（可选，格式 <平台>/<模型>，如 glm/GLM-5.2）：
      # 技能路由（/deploy 等斜杠命令）与 G1→G5 流程遵循度强依赖模型能力，
      # 轻量档（flash/turbo）易无视技能自由发挥；详见 .env.example 说明
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BOT_NAME=${FEISHU_BOT_NAME:-DevPilot助手}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Web UI HTTP 明文访问放行开关（默认 true 兼容 VM 直连；生产套反代+TLS 后设 false）
      - DEVPILLOT_INSECURE_AUTH=${DEVPILLOT_INSECURE_AUTH:-true}
      # 跨容器访问 litellm：bridge 网络内经服务名 devpilot-claude-litellm:4000
      # （容器名仍是 devpilot-claude-litellm，不是 compose service key "claude-litellm" —— service key 只用于 `docker compose <cmd>`）
      # （覆盖上方全局 LITELLM_PROXY_URL 的 127.0.0.1 取值，后者供 Claude 容器同容器回环使用）
      - LITELLM_PROXY_URL=http://devpilot-claude-litellm:4000
      # 宿主机可达 IP（可选）：bridge 模式下用于 OpenClaw 控制 UI 的 allowedOrigins /
      # WebSocket 来源白名单。留空则自动探测容器内 IP（localhost/SSH 隧道场景可用，
      # 局域网浏览器访问建议显式填写宿主机 LAN IP，如 192.168.1.100）。
      - DEVPILOT_HOST_IP=${DEVPILOT_HOST_IP:-}
      # SSH 受控部署通道（可选，Phase 2）：/deploy 构建类命令经此转发宿主机执行。
      # 默认 host.docker.internal（下方 extra_hosts 映射到 host-gateway，即宿主机），
      # 也可显式填宿主机 LAN IP。密钥经 data/deploy-keys 只读挂载，宿主机侧由
      # scripts/setup-deploy-ssh.sh 一键配置（forced-command 锁定只能跑部署处理器）。
      - DEPLOY_SSH_HOST=${DEPLOY_SSH_HOST:-}
      - DEPLOY_SSH_USER=${DEPLOY_SSH_USER:-devpilot-deploy}
      - DEPLOY_SSH_KEY=/opt/devpilot/deploy-keys/id_ed25519
      - DEPLOY_SSH_KNOWN_HOSTS=/opt/devpilot/deploy-keys/known_hosts
      # V8 堆上限显式设为 512MB。Node 在 768M 容器内的默认堆上限约 256MB，
      # gateway 处理长 SSE 流式回复时堆增长会撞限崩溃（"JavaScript heap out
      # of memory"，2026-08-26 实测，见运维手册 §13.7）；与下方容器 1024M 限制配套
      # （堆 512M + Node 运行时/外部内存开销）。gateway 由 `openclaw gateway`
      # 子进程运行，NODE_OPTIONS 随容器环境透传生效。
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./data/openclaw:/data/openclaw
      - ./logs/openclaw:/logs
      # /deploy 命令执行依赖（skills/deploy/SKILL.md 唯一入口）：部署处理器脚本 +
      # workspace 下的 service.yaml。只读挂载——本容器无 docker CLI，构建/部署类
      # 动作会被脚本前置检查拦截并提示宿主机执行（见用户操作手册 4.7）。
      # cicd 路径与 devpilot-claude-litellm 容器保持一致（/opt/devpilot/cicd）。
      - ./cicd:/opt/devpilot/cicd:ro
      - ./workspace:/workspace:ro
      # SSH 受控部署通道私钥（可选挂载）：scripts/setup-deploy-ssh.sh 生成。
      # 目录级挂载而非单文件——单文件挂载在密钥缺失时会被 Docker 自动创建为
      # 目录导致容器启动异常；目录挂载缺失时仅是空目录，SSH 探测失败后
      # handler 自动回退本地执行（拦截提示），行为与未配置一致。
      - ./data/deploy-keys:/opt/devpilot/deploy-keys:ro
    # 【P0-7】OpenClaw 由 host 网络改为 bridge 网络（devpilot-network），恢复容器隔离：
    #   - Redis 不再发布到宿主机，OpenClaw 经服务名 redis:6379 访问（见 init-openclaw.sh）
    #   - LiteLLM 经服务名 devpilot-claude-litellm:4000 访问（下方 LITELLM_PROXY_URL）
    #   - 网关端口通过 Docker 端口映射暴露到宿主机（18789:18789），局域网浏览器
    #     仍可经 http://<宿主机IP>:18789 直连；此端口建议仅在可信网络开放，
    #     生产环境套反向代理 + TLS 并限制来源。
    # 注意：bridge 模式下 OpenClaw 容器内网卡为 172.x，网关 --bind lan 会绑定到该
    #   容器内网地址；浏览器经宿主机端口映射访问时，WebSocket/CORS 来源需通过
    #   DEVPILOT_HOST_IP 显式指定宿主机可达 IP（见下方 env 与 init-openclaw.sh）。
    networks:
      - devpilot-network
    # DEPLOY_SSH_HOST 默认 host.docker.internal：经 host-gateway 映射到宿主机
    # （Docker 20.10+），免查 devpilot-network 网关 IP；.env 也可显式覆盖为 LAN IP。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 暴露到宿主机所有接口，供局域网浏览器经 http://<宿主机IP>:18789 访问。
      # 若仅本机访问，可改为 "127.0.0.1:18789:18789"。生产请配合防火墙 / 反代限制。
      - "18789:18789"
    logging: *default-logging
    healthcheck:
      # OpenClaw 容器已安装 curl（见 Dockerfile），网关提供 /healthz 端点。
      # 注意：此前误用 claude --version，但 claude CLI 装在 devpilot-claude 容器，
      # 本容器无此二进制，导致健康检查永远失败。务必用 curl /healthz。
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        # 2026-08-26 由 768M 上调：V8 堆上限提至 512MB（见上方 NODE_OPTIONS）后，
        # 堆 + Node 运行时/外部内存开销在 768M 内过于紧张，与 claude-litellm 对齐取 1024M
        limits:
          memory: 1024M
        reservations:
          memory: 768M

  # ============================================================
  # Claude Code + LiteLLM：合体容器（合并原 devpilot-claude 与 devpilot-litellm）
  # ============================================================
  claude-litellm:
    # 显式 image: 避免 docker compose 自动用 '<项目目录名>-<服务名>' 拼出 'devpilot-devpilot-claude-litellm'（多前缀）
    image: devpilot-claude-litellm:latest
    build:
      context: .
      dockerfile: dockerfiles/claude/Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.241}
        LITELLM_VERSION: ${LITELLM_VERSION:-1.82.6}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-claude-litellm
    restart: unless-stopped
    profiles: ["", "full", "dev"]
    stdin_open: true
    tty: true
    depends_on:
      openclaw:
        condition: service_started
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://127.0.0.1:4000}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}
      - HOME=/home/node

      # 服务自动部署
      - DEVPILOT_AUTO_DEPLOY=${DEVPILOT_AUTO_DEPLOY}
      # 服务部署脚本（cicd/service-deploy/*.sh）的 workspace 定位锚点。
      # 容器内挂载点固定为 /workspace（见上方 volumes）；声明为环境变量后，
      # docker exec 直调部署脚本也能正确解析（不依赖 start.sh 注入）。
      # 脚本侧另有 /.dockerenv 自动检测兜底（common.sh:resolve_workspace_dir）。
      - WORKSPACE_DIR=/workspace

      # 允许在 HTTP（非 TLS）下暴露 Basic/Bearer 凭证
      # 容器仅运行在内部 bridge 网络，由宿主机反向代理终止 TLS 后对外暴露
      - ALLOW_HTTP_BASIC_OVER_HTTP=1
    volumes:
      - ./workspace:/workspace
      # 目录名与服务 key（claude-litellm）对齐，2026-08-26 由 data/devpilot-claude
      # 改名而来（旧环境升级不迁移，走 ./scripts/rebuild.sh 清空重建）
      - ./data/claude-litellm:/home/node
      - ./logs/claude-litellm:/logs
      # cicd 目录以只读卷挂载，供 start.sh 的自动部署钩子（post-dev-hook.sh）调用。
      # .dockerignore 仅影响构建上下文，不影响运行时挂载；故镜像内不含 cicd，
      # 但容器运行时可通过此挂载访问宿主机 cicd/ 下的部署脚本。
      - ./cicd:/opt/devpilot/cicd:ro
    ports:
      # litellm 代理端口，仅监听宿主机回环：供宿主机侧脚本（service.sh/verify.sh/
      # rebuild.sh/deploy.sh）做健康检查与端到端验证。容器内的 Claude Code 经同容器
      # 127.0.0.1:4000 访问（见 start.sh）；跨容器的 OpenClaw 经服务名
      # devpilot-claude-litellm:4000 访问（见 OpenClaw 服务的 LITELLM_PROXY_URL），
      # 不经宿主机端口。不对宿主机之外暴露。
      - "127.0.0.1:4000:4000"
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      # Claude Code CLI 健康检查；litellm 由 start.sh 在容器内后台拉起，
      # 经 127.0.0.1:4000 暴露，就绪检查已在容器内完成，无需单独探活。
      test: ["CMD", "claude", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 768M

networks:
  devpilot-network:
    driver: bridge
    name: devpilot-network
