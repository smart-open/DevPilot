name: devpilot

# ============================================================
# DevPilot Docker Compose 一键部署
# 3 个容器：Redis + OpenClaw + CC-Switch/Claude Code
# 支持多平台大模型：Agnes AI、DeepSeek、GLM、火山方舟、百炼
# 所有平台均走 OpenAI Chat Completion 协议
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # Redis：缓存 + 持久化（推荐 Redis 8 LTS）
  # ============================================================
  redis:
    image: redis:8.8.1-alpine3.23
    container_name: devpilot-redis
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
      - ./logs/redis:/logs
    environment:
      - TZ=${TZ}
    networks:
      - devpilot-network
    # OpenClaw 使用 network_mode: host，需经宿主机回环访问 Redis，故在此发布 6379。
    # 若该端口需对外暴露，请在宿主机防火墙仅放行可信来源。
    ports:
      - "6379:6379"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================
  # OpenClaw：飞书 AI 机器人 + 多平台大模型对接
  # ============================================================
  openclaw:
    build:
      context: .
      dockerfile: dockerfiles/openclaw/Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.7.1-2}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-openclaw
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-devpilot-litellm}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}

      # OpenClaw 核心配置
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BOT_NAME=${FEISHU_BOT_NAME:-DevPilot助手}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./data/openclaw:/data/openclaw
      - ./logs/openclaw:/logs
    # 关键：使用宿主机网络，使 OpenClaw gateway --bind lan 检测到 VM 真实网卡 IP
    # （如 192.168.106.128）而非容器内网 172.x 地址；控制 UI 的 WebSocket 广播地址
    # 因此变为 ws://<VM_IP>:18789，浏览器经 http(s)://<VM_IP>:18789 可同源直连。
    # 注意：host 模式下不再需要 ports 映射（网关直接绑定宿主机端口）。
    network_mode: "host"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # ============================================================
  # CC-Switch + Claude Code：合体容器
  # ============================================================
  devpilot-claude:
    build:
      context: .
      dockerfile: dockerfiles/devpilot-claude/Dockerfile
      args:
        CC_SWITCH_VERSION: ${CC_SWITCH_VERSION:-v0.21.0}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.241}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-claude
    restart: unless-stopped
    profiles: ["", "full", "dev"]
    stdin_open: true
    tty: true
    depends_on:
      openclaw:
        condition: service_started
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-devpilot-litellm}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}

      # CC-Switch Web 配置
      - PORT=${CC_SWITCH_WEB_PORT}
      - HOST=0.0.0.0
      - HOME=/home/node

      # 服务自动部署
      - DEVPILOT_AUTO_DEPLOY=${DEVPILOT_AUTO_DEPLOY}

      # CC-Switch Web 登录密码（可选；留空则由 cc-switch-web 自动生成并写入卷内 web_password 文件）
      - CC_SWITCH_WEB_PASSWORD=${CC_SWITCH_WEB_PASSWORD:-}

      # 允许在 HTTP（非 TLS）下暴露 Basic/Bearer 凭证
      # 容器仅运行在内部 bridge 网络，由宿主机反向代理终止 TLS 后对外暴露
      - ALLOW_HTTP_BASIC_OVER_HTTP=1
    volumes:
      - ./workspace:/workspace
      - ./data/devpilot-claude:/home/node
      - ./logs/devpilot-claude:/logs
    ports:
      - "${CC_SWITCH_WEB_PORT}:${CC_SWITCH_WEB_PORT}"
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      # CC-Switch Web 启用 file-based credentials，未鉴权访问 / 返回 401 属正常“已就绪”态；
      # 故以“HTTP 服务已响应（curl -s，连接失败才判非就绪）”为健康判据，不能用 -f（4xx 判失败）。
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:${CC_SWITCH_WEB_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # ============================================================
  # LiteLLM 代理（复刻 CC-Switch 官方"本地路由"）
  # 暴露 Anthropic Messages /v1/messages 端点，翻译成 OpenAI Chat Completions
  # 转发给各平台（agnes/deepseek/glm/ark/bailian）。
  # 由 conf/litellm/gen_config.py 在容器启动时根据 .env 各平台 API Key
  # 生成 /app/litellm_config.yaml，Claude Code 通过 http://litellm:4000 访问。
  # ============================================================
  litellm:
    build:
      context: .
      dockerfile: dockerfiles/litellm/Dockerfile
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:-1.82.6}
    container_name: devpilot-litellm
    restart: unless-stopped
    profiles: ["", "full", "dev"]
    environment:
      - TZ=${TZ}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-devpilot-litellm}

      # 5 个平台凭据与端点（仅 key 有效的平台会被 gen_config.py 注册为模型）
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}

      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}

      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}
    ports:
      - "4000:4000"
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      # python:3.13-slim 镜像默认无 curl，用 python urllib 直接探测
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  devpilot-network:
    driver: bridge
    name: devpilot-network
