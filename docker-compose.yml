name: devpilot

# ============================================================
# DevPilot Docker Compose 一键部署
# 3 个容器：Redis + OpenClaw + CC-Switch/Claude Code
# 支持多平台大模型：Agnes AI、DeepSeek、GLM、火山方舟、百炼
# 所有平台均走 OpenAI Chat Completion 协议
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # Redis：缓存 + 持久化（推荐 Redis 8 LTS）
  # ============================================================
  redis:
    image: redis:8.8.1-alpine3.23
    container_name: devpilot-redis
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
      - ./logs/redis:/logs
    environment:
      - TZ=${TZ}
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================
  # OpenClaw：飞书 AI 机器人 + 多平台大模型对接
  # ============================================================
  openclaw:
    build:
      context: .
      dockerfile: dockerfiles/openclaw/Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-openclaw
    restart: unless-stopped
    profiles: ["", "full", "bot"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}

      # OpenClaw 核心配置
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./data/openclaw:/data/openclaw
      - ./logs/openclaw:/logs
    ports:
      - "${OPENCLAW_GATEWAY_PORT}:18789"
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # ============================================================
  # CC-Switch + Claude Code：合体容器
  # ============================================================
  cc-switch-claude:
    build:
      context: .
      dockerfile: dockerfiles/cc-switch-claude/Dockerfile
      args:
        CC_SWITCH_VERSION: ${CC_SWITCH_VERSION}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG}
    container_name: devpilot-cc-switch-claude
    restart: unless-stopped
    profiles: ["", "full", "dev"]
    stdin_open: true
    tty: true
    depends_on:
      openclaw:
        condition: service_started
    environment:
      - TZ=${TZ}
      - LLM_PLATFORM=${LLM_PLATFORM}

      # Agnes AI 平台
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}

      # DeepSeek 平台
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_CODE_MODEL=${DEEPSEEK_CODE_MODEL}

      # GLM（智谱）平台
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - GLM_MODEL=${GLM_MODEL}

      # 火山方舟（ARK）平台
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - ARK_CODE_PLAN_MODEL=${ARK_CODE_PLAN_MODEL}

      # 百炼平台
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_BASE_URL=${BAILIAN_BASE_URL}
      - BAILIAN_MODEL=${BAILIAN_MODEL}

      # CC-Switch Web 配置
      - PORT=${CC_SWITCH_WEB_PORT}
      - HOST=0.0.0.0
      - HOME=/home/node

      # 服务自动部署
      - DEVPILOT_AUTO_DEPLOY=${DEVPILOT_AUTO_DEPLOY}

      # 允许在 HTTP（非 TLS）下暴露 Basic/Bearer 凭证
      # 容器仅运行在内部 bridge 网络，由宿主机反向代理终止 TLS 后对外暴露
      - ALLOW_HTTP_BASIC_OVER_HTTP=1
    volumes:
      - ./workspace:/workspace
      - ./data/cc-switch-claude:/home/node
      - ./logs/cc-switch-claude:/logs
    ports:
      - "${CC_SWITCH_WEB_PORT}:${CC_SWITCH_WEB_PORT}"
    networks:
      - devpilot-network
    logging: *default-logging
    healthcheck:
      # CC-Switch Web 启用 file-based credentials，未鉴权访问 / 返回 401 属正常“已就绪”态；
      # 故以“HTTP 服务已响应（curl -s，连接失败才判非就绪）”为健康判据，不能用 -f（4xx 判失败）。
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:${CC_SWITCH_WEB_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

networks:
  devpilot-network:
    driver: bridge
    name: devpilot-network
