{{/*
DevPilot Helm Chart - Secret（敏感数据）
包含 API Key、密码、Token 等敏感信息

重要：values.yaml 中的占位符值仅用于开发测试
生产环境请通过 --set 或外部 Secret 注入真实值：
  helm install devpilot ./chart \
    --set agnes.apiKey=real-key \
    --set feishu.appId=real-id \
    --set feishu.appSecret=real-secret \
    --set redis.password=real-password \
    --set openclaw.gatewayToken=real-token

或使用 externalSecret 引用外部密钥管理系统
*/}}
{{- if not .Values.externalSecret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devpilot.name" . }}-secrets
  namespace: {{ include "devpilot.namespace" . }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # agnes-ai API 密钥
  AGNES_API_KEY: {{ .Values.agnes.apiKey | quote }}

  # 飞书应用配置
  FEISHU_APP_ID: {{ .Values.feishu.appId | quote }}
  FEISHU_APP_SECRET: {{ .Values.feishu.appSecret | quote }}

  # Redis 认证密码
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}

  # OpenClaw Gateway 认证 Token
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | quote }}
{{- end -}}
