# ============================================================
# DevPilot - GitHub Actions 持续集成工作流
# 功能：代码检查、构建 Docker 镜像、推送至 GHCR、Trivy 安全扫描
# 触发：推送到 main/master 分支、Pull Request
# ============================================================
name: DevPilot CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # 支持手动触发
  workflow_dispatch:

env:
  # 镜像仓库前缀（GitHub Container Registry）
  REGISTRY: ghcr.io
  # 镜像命名空间（使用仓库所有者名）
  IMAGE_PREFIX: ${{ github.repository }}
  # 构建参数默认值（与 .env.example 保持一致）
  NODE_IMAGE_TAG: "22.23.1-bookworm"
  OPENCLAW_VERSION: "2026.7.1-2"
  CLAUDE_CODE_VERSION: "2.1.241"

jobs:
  # ============================================================
  # 任务 1：代码检查（Lint）
  # ============================================================
  lint:
    name: 代码检查 (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 Shell 脚本语法
        run: |
          echo "==> 检查所有 shell 脚本语法 ..."
          # 收集所有 .sh 文件并进行语法检查
          FAIL=0
          while IFS= read -r file; do
            if bash -n "$file"; then
              echo "  [OK] $file"
            else
              echo "  [FAIL] $file"
              FAIL=1
            fi
          done < <(find . -name '*.sh' -not -path './node_modules/*')
          if [ "$FAIL" -eq 1 ]; then
            echo "存在语法错误的 shell 脚本，请修复后重试"
            exit 1
          fi

      - name: 检查 Dockerfile 是否存在
        run: |
          echo "==> 检查 Dockerfile 是否存在 ..."
          for df in dockerfiles/openclaw/Dockerfile dockerfiles/claude/Dockerfile; do
            if [ -f "$df" ]; then
              echo "  [OK] $df"
            else
              echo "  [FAIL] 缺少 $df"
              exit 1
            fi
          done

      - name: 检查 docker-compose.yml 语法
        run: |
          echo "==> 检查 docker-compose.yml 语法 ..."
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config -q && echo "  [OK] docker-compose.yml 语法正确"
          else
            echo "  [FAIL] 缺少 docker-compose.yml"
            exit 1
          fi

      - name: 检查 .env.example 完整性
        run: |
          echo "==> 检查 .env.example 变量完整性 ..."
          REQUIRED_VARS="AGNES_API_KEY AGNES_BASE_URL FEISHU_APP_ID FEISHU_APP_SECRET REDIS_PASSWORD OPENCLAW_GATEWAY_TOKEN OPENCLAW_GATEWAY_PORT NODE_IMAGE_TAG OPENCLAW_VERSION CLAUDE_CODE_VERSION TZ"
          for var in $REQUIRED_VARS; do
            if grep -q "^${var}=" .env.example; then
              echo "  [OK] ${var}"
            else
              echo "  [FAIL] .env.example 缺少变量: ${var}"
              exit 1
            fi
          done

  # ============================================================
  # 任务 2：构建并推送 Docker 镜像（OpenClaw）
  # ============================================================
  build-openclaw:
    name: 构建镜像 (OpenClaw)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/openclaw
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 OpenClaw 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/openclaw/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCLAW_VERSION=${{ env.OPENCLAW_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
          cache-from: type=gha,scope=openclaw
          cache-to: type=gha,mode=max,scope=openclaw

      - name: 导出镜像供扫描使用
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/openclaw/Dockerfile
          push: false
          load: true
          tags: devpilot-openclaw:ci-scan
          build-args: |
            OPENCLAW_VERSION=${{ env.OPENCLAW_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
          cache-from: type=gha,scope=openclaw

  # ============================================================
  # 任务 3：构建并推送 Docker 镜像（Claude Code + 内置 LiteLLM）
  # ============================================================
  build-devpilot-claude-litellm:
    name: 构建镜像 (devpilot-claude-litellm)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/devpilot-claude-litellm
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 devpilot-claude-litellm 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/claude/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |=${{ env. }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
          cache-from: type=gha,scope=devpilot-claude-litellm
          cache-to: type=gha,mode=max,scope=devpilot-claude-litellm

      - name: 导出镜像供扫描使用
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/claude/Dockerfile
          push: false
          load: true
          tags: devpilot-claude-litellm:ci-scan
          build-args: |=${{ env. }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
          cache-from: type=gha,scope=devpilot-claude-litellm

  # ============================================================
  # 任务 4：Trivy 安全扫描
  # ============================================================
  security-scan:
    name: 安全扫描 (Trivy)
    needs: [build-openclaw, build-devpilot-claude-litellm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest

      # 注：CI 构建中未推送（PR），因此直接构建用于扫描
      - name: 构建 OpenClaw 镜像（用于扫描）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/openclaw/Dockerfile
          push: false
          load: true
          tags: devpilot-openclaw:ci-scan
          build-args: |
            OPENCLAW_VERSION=${{ env.OPENCLAW_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}

      - name: 构建 devpilot-claude-litellm 镜像（用于扫描）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/claude/Dockerfile
          push: false
          load: true
          tags: devpilot-claude-litellm:ci-scan
          build-args: |=${{ env. }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}

      - name: Trivy 扫描 OpenClaw 镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devpilot-openclaw:ci-scan
          format: sarif
          output: trivy-openclaw-results.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Trivy 扫描 devpilot-claude-litellm 镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devpilot-claude-litellm:ci-scan
          format: sarif
          output: trivy-devpilot-claude-litellm-results.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: 上传 OpenClaw 扫描结果到 GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-openclaw-results.sarif

      - name: 上传 devpilot-claude-litellm 扫描结果到 GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-devpilot-claude-litellm-results.sarif

      - name: 扫描文件系统（配置文件安全检查）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
