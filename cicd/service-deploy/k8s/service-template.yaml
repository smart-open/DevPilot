# ============================================================
# DevPilot - K8s 通用服务部署模板
# deploy-service.sh 的 deploy_k8s 函数使用此模板
# 通过 sed 替换占位符生成最终清单
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{NAMESPACE}}
  labels:
    app.kubernetes.io/part-of: devpilot
    app.kubernetes.io/managed-by: devpilot-service-deploy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{SERVICE_NAME}}
    app.kubernetes.io/part-of: devpilot
    app.kubernetes.io/managed-by: devpilot-service-deploy
spec:
  replicas: {{REPLICAS}}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{SERVICE_NAME}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{SERVICE_NAME}}
    spec:
      containers:
        - name: {{SERVICE_NAME}}
          image: {{IMAGE}}
          imagePullPolicy: {{IMAGE_PULL_POLICY}}
          ports:
            - containerPort: {{PORT}}
              name: http
{{RESOURCES_BLOCK}}
{{LIVENESS_PROBE_BLOCK}}
{{READINESS_PROBE_BLOCK}}
{{ENV_BLOCK}}

---
apiVersion: v1
kind: Service
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{SERVICE_NAME}}
    app.kubernetes.io/part-of: devpilot
spec:
  type: {{SERVICE_TYPE}}
  selector:
    app.kubernetes.io/name: {{SERVICE_NAME}}
  ports:
    - port: {{PORT}}
      targetPort: {{PORT}}
      protocol: TCP
      name: http
{{NODE_PORT_BLOCK}}
