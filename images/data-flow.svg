<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720">
  <defs>
    <marker id="arrE" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="720" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7">数据流转流程图</text>
  <text x="540" y="58" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12" fill="#71717a">飞书机器人 + Claude Code 两条数据流</text>

  <!-- ===== Flow 1: 飞书机器人 ===== -->
  <rect x="40" y="85" width="500" height="580" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="85" width="500" height="40" rx="12" fill="#10b981" opacity="0.08"/>
  <text x="290" y="110" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#10b981">数据流 A：飞书机器人</text>

  <!-- Step 1 -->
  <rect x="70" y="145" width="440" height="60" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="95" cy="175" r="14" fill="#10b981" opacity="0.15"/>
  <text x="95" y="179" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">01</text>
  <text x="120" y="170" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">飞书用户发送消息</text>
  <text x="120" y="188" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">用户在飞书中向机器人发送文本/图片/视频指令</text>

  <line x1="290" y1="205" x2="290" y2="235" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE)"/>

  <!-- Step 2 -->
  <rect x="70" y="240" width="440" height="60" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="95" cy="270" r="14" fill="#10b981" opacity="0.15"/>
  <text x="95" y="274" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">02</text>
  <text x="120" y="265" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">WebSocket 推送到 OpenClaw</text>
  <text x="120" y="283" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">飞书 SDK 通过 WebSocket 长连接双向推送消息</text>

  <line x1="290" y1="300" x2="290" y2="330" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE)"/>

  <!-- Step 3 -->
  <rect x="70" y="335" width="440" height="60" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="95" cy="365" r="14" fill="#10b981" opacity="0.15"/>
  <text x="95" y="369" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">03</text>
  <text x="120" y="360" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">构建 AI 请求 → agnes-ai API</text>
  <text x="120" y="378" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">使用 AGNES_API_KEY 发送 HTTPS 请求到 apihub.agnes-ai.com</text>

  <line x1="290" y1="395" x2="290" y2="425" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE)"/>

  <!-- Step 4 -->
  <rect x="70" y="430" width="440" height="60" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="95" cy="460" r="14" fill="#10b981" opacity="0.15"/>
  <text x="95" y="464" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">04</text>
  <text x="120" y="455" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">agnes-ai 返回响应</text>
  <text x="120" y="473" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">返回文本/图片/视频，可能使用 Redis 缓存上下文</text>

  <line x1="290" y1="490" x2="290" y2="520" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE)"/>

  <!-- Step 5 -->
  <rect x="70" y="525" width="440" height="60" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="95" cy="555" r="14" fill="#10b981" opacity="0.15"/>
  <text x="95" y="559" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981">05</text>
  <text x="120" y="550" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">格式化回复 → WebSocket 回传</text>
  <text x="120" y="568" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">OpenClaw 格式化响应后通过 WebSocket 回传给飞书用户</text>

  <!-- Redis cache note -->
  <rect x="70" y="605" width="440" height="40" rx="8" fill="rgba(239,68,68,0.05)" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="290" y="630" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">Redis 可选缓存会话上下文和限流计数</text>

  <!-- ===== Flow 2: Claude Code ===== -->
  <rect x="560" y="85" width="500" height="580" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="560" y="85" width="500" height="40" rx="12" fill="#60a5fa" opacity="0.08"/>
  <text x="810" y="110" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#60a5fa">数据流 B：Claude Code</text>

  <!-- Step 1 -->
  <rect x="590" y="145" width="440" height="60" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="615" cy="175" r="14" fill="#60a5fa" opacity="0.15"/>
  <text x="615" y="179" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa">01</text>
  <text x="640" y="170" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">启动 Claude Code 会话</text>
  <text x="640" y="188" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">docker compose exec cc-switch-claude claude</text>

  <line x1="810" y1="205" x2="810" y2="235" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Step 2 -->
  <rect x="590" y="240" width="440" height="60" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="615" cy="270" r="14" fill="#60a5fa" opacity="0.15"/>
  <text x="615" y="274" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa">02</text>
  <text x="640" y="265" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">读取配置（CC-Switch 优先）</text>
  <text x="640" y="283" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">优先 ~/.claude/ 配置（takeover），否则使用环境变量</text>

  <line x1="810" y1="300" x2="810" y2="330" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Step 3 -->
  <rect x="590" y="335" width="440" height="60" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="615" cy="365" r="14" fill="#60a5fa" opacity="0.15"/>
  <text x="615" y="369" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa">03</text>
  <text x="640" y="360" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">直连 agnes-ai API</text>
  <text x="640" y="378" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">Claude Code 直连 apihub.agnes-ai.com 进行 AI 编程</text>

  <line x1="810" y1="395" x2="810" y2="425" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Step 4 -->
  <rect x="590" y="430" width="440" height="60" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="615" cy="460" r="14" fill="#60a5fa" opacity="0.15"/>
  <text x="615" y="464" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa">04</text>
  <text x="640" y="455" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">代码操作在 /workspace</text>
  <text x="640" y="473" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">映射到宿主机 workspace/ 目录，支持 Git 版本控制</text>

  <line x1="810" y1="490" x2="810" y2="520" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Step 5 -->
  <rect x="590" y="525" width="440" height="60" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow2)"/>
  <circle cx="615" cy="555" r="14" fill="#60a5fa" opacity="0.15"/>
  <text x="615" y="559" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa">05</text>
  <text x="640" y="550" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">AI 编程交互完成</text>
  <text x="640" y="568" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">代码生成/修改/测试结果返回给开发者</text>

  <!-- CC-Switch note -->
  <rect x="590" y="605" width="440" height="40" rx="8" fill="rgba(96,165,250,0.05)" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="810" y="630" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">CC-Switch Web UI (:8890) 可随时切换 API 供应商</text>
</svg>