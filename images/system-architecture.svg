<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720">
  <defs>
    <marker id="arrEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a1a1aa"/>
    </marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1080" height="720" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7">DevPilot 系统架构图</text>
  <text x="540" y="58" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12" fill="#71717a">Docker Compose 一键部署 — 3 容器架构</text>

  <!-- Docker Host outer box -->
  <rect x="30" y="78" width="1020" height="500" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="55" y="102" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#71717a" letter-spacing="0.05em">DOCKER HOST (宿主机)</text>

  <!-- devpilot-network box -->
  <rect x="60" y="350" width="960" height="50" rx="8" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="540" y="380" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#f59e0b" opacity="0.7">devpilot-network (Docker Bridge Network)</text>

  <!-- Redis Container -->
  <rect x="75" y="130" width="260" height="200" rx="10" fill="#1e1e26" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="75" y="130" width="260" height="38" rx="10" fill="#ef4444" opacity="0.9"/>
  <rect x="75" y="158" width="260" height="10" fill="#ef4444" opacity="0.9"/>
  <text x="205" y="154" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fff">Redis</text>
  <text x="205" y="185" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a1a1aa">redis:8.8.1-alpine</text>
  <rect x="95" y="200" width="80" height="22" rx="4" fill="#0d0d0f" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <text x="135" y="215" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">:6379</text>
  <text x="93" y="240" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• AOF 持久化 (everysec)</text>
  <text x="93" y="258" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• RDB 快照 (3 级)</text>
  <text x="93" y="276" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• 密码认证</text>
  <text x="93" y="294" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• maxmemory 512mb + LRU</text>
  <text x="93" y="312" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• 仅容器内部访问</text>

  <!-- OpenClaw Container -->
  <rect x="410" y="130" width="260" height="200" rx="10" fill="#1e1e26" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="410" y="130" width="260" height="38" rx="10" fill="#10b981" opacity="0.9"/>
  <rect x="410" y="158" width="260" height="10" fill="#10b981" opacity="0.9"/>
  <text x="540" y="154" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fff">OpenClaw</text>
  <text x="540" y="185" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a1a1aa">openclaw@2026.7.1-2</text>
  <rect x="430" y="200" width="90" height="22" rx="4" fill="#0d0d0f" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <text x="475" y="215" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">:18789</text>
  <text x="428" y="240" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• 飞书长连接 (WebSocket)</text>
  <text x="428" y="258" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• agnes-ai 直连 Provider</text>
  <text x="428" y="276" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• Gateway 控制面板</text>
  <text x="428" y="294" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• 多模态 AI (文本/图片/视频)</text>
  <text x="428" y="312" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• Redis 缓存连接</text>

  <!-- CC-Switch + Claude Code Container -->
  <rect x="745" y="130" width="260" height="200" rx="10" fill="#1e1e26" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="745" y="130" width="260" height="38" rx="10" fill="#60a5fa" opacity="0.9"/>
  <rect x="745" y="158" width="260" height="10" fill="#60a5fa" opacity="0.9"/>
  <text x="875" y="154" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fff">CC-Switch + Claude Code</text>
  <text x="875" y="185" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a1a1aa">cc-switch:v0.21.0 / claude:2.1.220</text>
  <rect x="765" y="200" width="80" height="22" rx="4" fill="#0d0d0f" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <text x="805" y="215" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">:8890</text>
  <text x="763" y="240" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• CC-Switch Web UI</text>
  <text x="763" y="258" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• Claude Code CLI</text>
  <text x="763" y="276" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• 供应商一键切换 (takeover)</text>
  <text x="763" y="294" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• Git 版本控制</text>
  <text x="763" y="312" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">• workspace 工作空间</text>

  <!-- Data volume indicators -->
  <rect x="95" y="420" width="220" height="28" rx="6" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <text x="205" y="438" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#71717a">data/redis  |  logs/redis</text>
  <rect x="430" y="420" width="220" height="28" rx="6" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <text x="540" y="438" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#71717a">data/openclaw  |  logs/openclaw</text>
  <rect x="765" y="420" width="220" height="28" rx="6" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <text x="875" y="438" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#71717a">workspace  |  logs/cc-switch-claude</text>

  <!-- Connection lines between containers -->
  <line x1="335" y1="230" x2="410" y2="230" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrAmber)"/>
  <text x="372" y="222" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#71717a">redis:6379</text>
  <line x1="670" y1="230" x2="745" y2="230" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>

  <!-- External Services -->
  <!-- 飞书服务器 -->
  <rect x="410" y="490" width="180" height="70" rx="10" fill="#16161a" stroke="#10b981" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="500" y="520" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#10b981">飞书服务器</text>
  <text x="500" y="540" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#71717a">Feishu Server</text>

  <!-- agnes-ai API -->
  <rect x="745" y="490" width="180" height="70" rx="10" fill="#16161a" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="835" y="520" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#a78bfa">agnes-ai API</text>
  <text x="835" y="540" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">apihub.agnes-ai.com</text>

  <!-- 浏览器 -->
  <rect x="75" y="490" width="180" height="70" rx="10" fill="#16161a" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="165" y="520" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#60a5fa">浏览器</text>
  <text x="165" y="540" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#71717a">Browser</text>

  <!-- Connection arrows -->
  <!-- 飞书 → OpenClaw -->
  <path d="M 500 490 Q 500 430 540 330" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrEmerald)"/>
  <text x="455" y="430" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10b981" opacity="0.8">WebSocket 长连接</text>

  <!-- agnes-ai → OpenClaw -->
  <path d="M 780 490 Q 700 420 600 330" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrBlue)"/>
  <text x="640" y="430" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a78bfa" opacity="0.8">HTTPS API</text>

  <!-- agnes-ai → CC-Switch -->
  <path d="M 870 490 Q 880 420 875 330" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrBlue)"/>
  <text x="900" y="420" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a78bfa" opacity="0.8">HTTPS</text>

  <!-- 浏览器 → CC-Switch -->
  <path d="M 255 525 Q 500 480 745 280" stroke="#60a5fa" stroke-width="1.5" fill="none" stroke-dasharray="6,3" opacity="0.5" marker-end="url(#arrBlue)"/>
  <text x="420" y="475" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#60a5fa" opacity="0.6">HTTP :8890</text>

  <!-- Legend -->
  <rect x="30" y="600" width="1020" height="90" rx="8" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <text x="55" y="625" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="0.08em">图例</text>
  <line x1="55" y1="645" x2="95" y2="645" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="105" y="649" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">WebSocket 长连接</text>
  <line x1="255" y1="645" x2="295" y2="645" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="305" y="649" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">HTTPS API 调用</text>
  <line x1="455" y1="645" x2="495" y2="645" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="505" y="649" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">内部网络通信</text>
  <line x1="655" y1="645" x2="695" y2="645" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="705" y="649" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">HTTP 访问</text>
  <text x="55" y="675" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">虚线框 = 外部服务  |  实线框 = Docker 容器  |  虚线箭头 = 网络/数据流向</text>
</svg>