<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720">
  <defs>
    <marker id="arrE2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrA2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrB2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="720" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e4e4e7">业务流程图</text>
  <text x="540" y="58" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12" fill="#71717a">从配置到使用的完整业务流程</text>

  <!-- ===== Phase 1: 配置 ===== -->
  <rect x="40" y="85" width="1000" height="145" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="85" width="1000" height="36" rx="12" fill="#f59e0b" opacity="0.06"/>
  <text x="60" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="0.1em">PHASE 1 — 配置</text>

  <!-- Step boxes -->
  <rect x="70" y="135" width="280" height="75" rx="8" fill="#1e1e26" stroke="#f59e0b" stroke-width="1" filter="url(#glow3)"/>
  <text x="85" y="158" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">克隆项目</text>
  <text x="85" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">git clone devpilot</text>
  <text x="85" y="194" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">获取项目代码和配置模板</text>

  <line x1="350" y1="172" x2="390" y2="172" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrA2)"/>

  <rect x="400" y="135" width="280" height="75" rx="8" fill="#1e1e26" stroke="#f59e0b" stroke-width="1" filter="url(#glow3)"/>
  <text x="415" y="158" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">配置 .env</text>
  <text x="415" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">./init.sh（交互式向导）</text>
  <text x="415" y="194" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">填入 API Key + 飞书凭证</text>

  <line x1="680" y1="172" x2="720" y2="172" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrA2)"/>

  <rect x="730" y="135" width="280" height="75" rx="8" fill="#1e1e26" stroke="#f59e0b" stroke-width="1" filter="url(#glow3)"/>
  <text x="745" y="158" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">验证配置</text>
  <text x="745" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">检查必填项 + 网络连通性</text>
  <text x="745" y="194" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">密码和 Token 自动生成</text>

  <!-- Arrow down -->
  <path d="M 540 230 L 540 260" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrE2)"/>

  <!-- ===== Phase 2: 部署 ===== -->
  <rect x="40" y="270" width="1000" height="145" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="270" width="1000" height="36" rx="12" fill="#10b981" opacity="0.06"/>
  <text x="60" y="293" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981" letter-spacing="0.1em">PHASE 2 — 部署</text>

  <rect x="70" y="320" width="280" height="75" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow3)"/>
  <text x="85" y="343" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">一键部署</text>
  <text x="85" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">./deploy.sh 或 make up</text>
  <text x="85" y="379" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">构建镜像 + 启动容器</text>

  <line x1="350" y1="357" x2="390" y2="357" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE2)"/>

  <rect x="400" y="320" width="280" height="75" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow3)"/>
  <text x="415" y="343" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">健康检查</text>
  <text x="415" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">make health</text>
  <text x="415" y="379" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">Redis + OpenClaw + CC-Switch</text>

  <line x1="680" y1="357" x2="720" y2="357" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrE2)"/>

  <rect x="730" y="320" width="280" height="75" rx="8" fill="#1e1e26" stroke="#10b981" stroke-width="1" filter="url(#glow3)"/>
  <text x="745" y="343" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">飞书连接</text>
  <text x="745" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">WebSocket 自动建立</text>
  <text x="745" y="379" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">OpenClaw 连接飞书服务器</text>

  <!-- Arrow down -->
  <path d="M 540 415 L 540 445" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrB2)"/>

  <!-- ===== Phase 3: 使用 ===== -->
  <rect x="40" y="455" width="1000" height="145" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="455" width="1000" height="36" rx="12" fill="#60a5fa" opacity="0.06"/>
  <text x="60" y="478" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#60a5fa" letter-spacing="0.1em">PHASE 3 — 使用</text>

  <rect x="70" y="505" width="280" height="75" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow3)"/>
  <text x="85" y="528" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">飞书机器人</text>
  <text x="85" y="546" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">在飞书中发消息</text>
  <text x="85" y="564" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">AI 对话/图片/视频生成</text>

  <line x1="350" y1="542" x2="390" y2="542" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB2)"/>

  <rect x="400" y="505" width="280" height="75" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow3)"/>
  <text x="415" y="528" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">Claude Code</text>
  <text x="415" y="546" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">make claude</text>
  <text x="415" y="564" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">AI 编程 / 代码生成 / Git</text>

  <line x1="680" y1="542" x2="720" y2="542" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrB2)"/>

  <rect x="730" y="505" width="280" height="75" rx="8" fill="#1e1e26" stroke="#60a5fa" stroke-width="1" filter="url(#glow3)"/>
  <text x="745" y="528" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">CC-Switch 管理</text>
  <text x="745" y="546" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa">localhost:8890</text>
  <text x="745" y="564" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="10" fill="#71717a">供应商切换 / 配置管理</text>

  <!-- ===== Phase 4: 运维 ===== -->
  <rect x="40" y="620" width="1000" height="75" rx="12" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="620" width="1000" height="30" rx="12" fill="#a78bfa" opacity="0.06"/>
  <text x="60" y="640" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="0.1em">PHASE 4 — 运维（持续）</text>

  <text x="60" y="668" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11" fill="#a1a1aa">日常运维：日志监控 (make logs)  ·  数据备份 (make backup)  ·  版本更新 (make update)  ·  健康检查 (make health)  ·  故障排查</text>

  <!-- Side connectors -->
  <path d="M 540 600 L 540 620" stroke="#a1a1aa" stroke-width="2" fill="none" stroke-dasharray="4,3" opacity="0.4"/>
</svg>